name: Test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ensure example slides PDF
        run: |
          if [ ! -f talks/2026-09-01-how-to-add-a-talk/slides.pdf ]; then
            node scripts/build-example.mjs
          fi
      - run: npm test
