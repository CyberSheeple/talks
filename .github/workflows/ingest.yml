name: Extract slide text
on:
  pull_request:
    paths:
      - "talks/**/slides.pdf"
      - "talks/**/talk.json"
      - "talks/**/recap.md"
      - "talks/**/transcript.md"
      - "talks/**/slides.md"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "talks/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Ensure example slides PDF
        run: |
          if [ ! -f talks/2026-09-01-how-to-add-a-talk/slides.pdf ]; then
            node scripts/build-example.mjs
          fi
      - run: npm test
      - run: node scripts/ingest.mjs
      - name: Comment on empty extracts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          empty=$(jq -r '[.talks[] | select(.extractStatus=="empty") | .slug] | join(", ")' talks/index.json)
          if [ -n "$empty" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "No extractable text in: \`${empty}\`. Re-export with **File → Download → PDF Document** (not Print-to-PDF) if search should work."
          fi
      - name: Commit generated files (same-repo only)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talks
          if git diff --cached --quiet; then
            echo "Index already current."
            exit 0
          fi
          git commit -m "chore: extract slide text and rebuild catalog index"
          git push
